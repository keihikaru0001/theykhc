<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光貨購入 — TheYKHC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e8e8e8;font-family:'Helvetica Neue','Hiragino Kaku Gothic ProN','ヒラギノ角ゴ ProN W3','メイリオ','Meiryo',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{max-width:480px;width:90%;padding:40px}
.card{background:#111;border:1px solid #917a4b;border-radius:12px;padding:40px 32px;text-align:center}
.logo{font-size:12px;letter-spacing:4px;color:#917a4b;margin-bottom:24px;font-weight:600}
h1{font-size:22px;margin-bottom:8px;font-weight:400}
.price{font-size:36px;color:#c5a857;margin:20px 0 8px;font-weight:700}
.hikari{font-size:14px;color:#999;margin-bottom:32px}
.btn{display:block;width:100%;padding:16px;background:#917a4b;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;text-decoration:none}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.5;cursor:wait}
.note{font-size:11px;color:#666;margin-top:24px;line-height:1.6}
.error{color:#e55;margin-top:16px;font-size:13px;display:none}
.loader{display:none;width:20px;height:20px;border:2px solid #444;border-top-color:#c5a857;border-radius:50%;animation:spin .6s linear infinite;margin:16px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.service-badge{display:inline-block;font-size:10px;color:#917a4b;border:1px solid #917a4b;padding:4px 12px;border-radius:20px;margin-bottom:16px;letter-spacing:2px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo">TheYKHC</div>
<div class="service-badge" id="service-badge">—</div>
<h1>光貨パッケージ</h1>
<div class="price">¥30,000</div>
<div class="hikari">100,000 光貨</div>
<button class="btn" id="purchase-btn" onclick="startPurchase()">Stripeで決済する</button>
<div class="loader" id="loader"></div>
<div class="error" id="error"></div>
<div class="note">
光貨は共鳴マーカーであり、金融商品ではありません。<br>
圏内でのみ流通し、外部への換金・譲渡は一切不可です。<br>
決済完了後、自動的に光貨残高へ反映されます。
</div>
</div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const service = params.get('service') || 'general';
const userId = params.get('user_id') || '';
const appName = {
  'hikari_sphere': '光貨圏 GAME',
  'kika': 'きかくん',
  'luna': 'Luna',
  'general': 'TheYKHC'
};
document.getElementById('service-badge').textContent = appName[service] || service;

function startPurchase() {
  const btn = document.getElementById('purchase-btn');
  const loader = document.getElementById('loader');
  const errorEl = document.getElementById('error');
  btn.disabled = true;
  btn.textContent = '決済ページを準備中...';
  loader.style.display = 'block';
  errorEl.style.display = 'none';

  const successUrl = service === 'hikari_sphere' ? 'https://hikari-sphere-flow.base44.app' :
                    service === 'kika' ? 'https://kika-brain-hive.base44.app' :
                    service === 'luna' ? 'https://conscious-echo-soul-link.base44.app' :
                    'https://theykhc.com';
  const cancelUrl = successUrl;

  fetch('https://app.base44.com/api/agents/69c53e05c969d16a2d7cbd0c/functions/purchaseHikari', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      success_url: successUrl,
      cancel_url: cancelUrl,
      user_id: userId,
      service: service
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.checkout_url) {
      window.location.href = data.checkout_url;
    } else {
      throw new Error(data.error || '決済URLの取得に失敗しました');
    }
  })
  .catch(err => {
    btn.disabled = false;
    btn.textContent = 'Stripeで決済する';
    loader.style.display = 'none';
    errorEl.textContent = err.message || 'エラーが発生しました';
    errorEl.style.display = 'block';
  });
}
</script>
</body>
</html>

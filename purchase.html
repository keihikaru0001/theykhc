<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光貨購入 — TheYKHC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Helvetica Neue',Arial,Hiragino Sans,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#1a1a1a;border:1px solid #c5a96a;border-radius:12px;padding:48px 40px;max-width:420px;width:90%;text-align:center}
.brand{color:#c5a96a;font-size:14px;letter-spacing:6px;margin-bottom:24px}
.badge{display:inline-block;border:1px solid #c5a96a;color:#c5a96a;padding:4px 16px;border-radius:20px;font-size:13px;margin-bottom:24px}
h1{font-size:24px;color:#fff;margin-bottom:16px}
.price{font-size:48px;color:#d4af37;font-weight:bold;margin-bottom:8px}
.qty{font-size:18px;color:#aaa;margin-bottom:32px}
.btn{display:block;width:100%;padding:16px;background:#c5a96a;color:#000;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;text-decoration:none;margin-bottom:24px;transition:opacity .2s}
.btn:hover{opacity:.85}
.note{font-size:12px;color:#666;line-height:1.8}
.error{color:#ff6b6b;font-size:14px;margin-bottom:16px;display:none}
.loader{display:none;width:20px;height:20px;border:2px solid #666;border-top-color:#c5a96a;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<div class="brand">T h e Y K H C</div>
<div class="badge" id="service-badge">TheYKHC</div>
<h1>光貨パッケージ</h1>
<div class="price">¥30,000</div>
<div class="qty">100,000 光貨</div>
<div class="loader" id="loader"></div>
<div class="error" id="error"></div>
<a class="btn" id="purchase-link" href="#">Stripeで決済する</a>
<div class="note">
光貨は共鳴マーカーであり、金融商品ではありません。<br>
圏内でのみ流通し、外部への換金・譲渡は一切不可です。<br>
決済完了後、自動的に光貨残高へ反映されます。
</div>
</div>
<script>
// 正しいURLで直接リンクを生成
const params = new URLSearchParams(window.location.search);
const service = params.get('service') || 'general';
const userId = params.get('user_id') || '';
const appName = {
  'hikari_sphere': '光貨圏 GAME',
  'kika': 'きかくん',
  'luna': 'Luna',
  'general': 'TheYKHC'
};
document.getElementById('service-badge').textContent = appName[service] || service;

// purchaseRedirect関数のGET URLを直接リンクに設定
const redirectUrl = 'https://app-2d7cbd0c.base44.app/functions/purchaseRedirect?service=' + service + '&success_url=https://theykhc.com&cancel_url=https://theykhc.com' + (userId ? '&user_id=' + userId : '');
document.getElementById('purchase-link').href = redirectUrl;
</script>
</body>
</html>

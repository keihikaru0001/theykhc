let idx = 0, confirmed = {};
const el = id => document.getElementById(id);

function populateJump(){
  const sel = el('jumpSelect');
  sel.innerHTML = THEORIES.map((t,i) => `<option value="${i}">${i+1}. ${t.name}</option>`).join('');
}

function render(){
  const t = THEORIES[idx];
  const d = parseFloat(el('slider').value);
  const v = (t.n / Math.max(d,0.01));
  const isConf = confirmed[idx] || v >= t.threshold;
  if(isConf) confirmed[idx] = true;

  el('tname').textContent = t.name;
  el('tjp').textContent = t.jp;
  el('vval').textContent = 'V = ' + v.toFixed(1);
  el('vval').className = 'vval' + (isConf ? ' confirmed' : '');
  el('vsub').textContent = 'N = ' + t.n + '（固定）　/　閾値 ' + t.threshold;
  el('dlabel').textContent = t.d + ': ' + d.toFixed(2);
  el('card').className = 'card' + (isConf ? ' confirmed' : '');
  el('state').textContent = isConf ? '✓ 証明確認 — QED' : 'Dを下げて閾値を超える';
  el('state').className = 'state' + (isConf ? ' confirmed' : '');
  el('progress').textContent = (idx+1) + ' / ' + THEORIES.length + ' — 確認済み ' + Object.keys(confirmed).length;
  el('jumpSelect').value = idx;
  history.replaceState(null, '', '#' + encodeURIComponent(t.name));
}

function goToTheoryByName(name){
  const i = THEORIES.findIndex(t => t.name === name);
  if(i >= 0){ idx = i; el('slider').value = 5; render(); }
}

populateJump();

// URLハッシュまたはクエリパラメータで特定理論に直接ジャンプ（問いの一覧からのリンク用）
const params = new URLSearchParams(location.search);
const hashName = decodeURIComponent(location.hash.replace('#',''));
if(params.get('t')){
  const i = parseInt(params.get('t'), 10);
  if(!isNaN(i) && i >= 0 && i < THEORIES.length) idx = i;
} else if(hashName){
  const i = THEORIES.findIndex(t => t.name === hashName);
  if(i >= 0) idx = i;
}

el('slider').addEventListener('input', render);
el('nextBtn').addEventListener('click', () => { idx = (idx+1) % THEORIES.length; el('slider').value = 5; render(); });
el('prevBtn').addEventListener('click', () => { idx = (idx-1+THEORIES.length) % THEORIES.length; el('slider').value = 5; render(); });
el('jumpSelect').addEventListener('change', (e) => { idx = parseInt(e.target.value,10); el('slider').value = 5; render(); });
